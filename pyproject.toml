[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtdp"
version = "0.1.0"
description = "Governed Trading Data Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "websockets>=12.0",
    "google-cloud-pubsub>=2.21",
    "google-cloud-bigquery>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
dbt = ["dbt-bigquery>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gtdp"]
known-third-party = ["airflow"]
