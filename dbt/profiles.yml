# Uses Application Default Credentials (gcloud auth application-default login)
# or a service-account key via GOOGLE_APPLICATION_CREDENTIALS.
governed_trading:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'placeholder-project') }}"
      dataset: "{{ env_var('DBT_DATASET', 'gtdp') }}"
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      job_execution_timeout_seconds: 300
