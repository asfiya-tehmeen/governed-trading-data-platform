name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v

  dbt:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ci-placeholder-project
      DBT_PROFILES_DIR: .
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-bigquery>=1.8"
      # parse compiles every model, test and contract without a warehouse connection
      - run: dbt deps && dbt parse
